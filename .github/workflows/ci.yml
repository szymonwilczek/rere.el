name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['29.4', '30.1']
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install dependencies
        run: |
          emacs -Q --batch --eval '
            (progn
              (require (quote package))
              (add-to-list
               (quote package-archives)
               (cons "melpa"
                     "https://melpa.org/packages/"))
              (package-initialize)
              (package-refresh-contents)
              (package-install (quote magit)))'

      - name: Check style
        run: make check-style

      - name: Byte-compile
        run: make compile

      - name: Run tests
        run: make test
